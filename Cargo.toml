[package]
name = "screen-time"
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
description = "Local, per-user screen-time tracker with a static Rofi day timeline"
repository = "https://github.com/WillGle/screen-time-rofi"
license = "MIT"

[lib]
name = "screen_time"
path = "src/lib.rs"

[[bin]]
name = "screen-time"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "0.8"
zbus = { version = "5.19", features = ["blocking-api"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

[features]
session-count = []
